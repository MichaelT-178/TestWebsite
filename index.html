<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LivestreamDirectory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary-color: #111;
      --accent-color: #007acc;
      --background-color: #f0f2f5;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background-color);
      font-family: var(--font-family);
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    strong {
      color: var(--accent-color);
    }

    .alt-link {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--primary-color);
    }

    .alt-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    .alt-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LivestreamDirectory will be back <strong>VERY</strong> soon!</h1>
    <p class="alt-link">Use <a href="https://coreyheuvelsearch.com" target="_blank" rel="noopener">coreyheuvelsearch.com</a> in the meantime.</p>
  </div>
</body>
</html>
